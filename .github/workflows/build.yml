name: Build mPaaS AMR CLI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            executable: mpaas-amr-linux-x64
            openapi_executable: mpaas-openapi-rs
          - os: windows-2022
            target: win32-x64
            executable: mpaas-amr-win32-x64.exe
            openapi_executable: mpaas-openapi-rs.exe
    runs-on: ${{ matrix.os }}
    env:
      MINIDEV_SKIP_DOWNLOAD_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - name: Test Rust OpenAPI client
        run: cargo test --locked --manifest-path rust-sdk/Cargo.toml
      - run: npm run build:openapi
      - name: Verify read-only OpenAPI demo
        run: node scripts/verify-openapi.mjs rust-sdk/target/release/${{ matrix.openapi_executable }}
      - name: Verify automatic version, upload and publish recovery
        run: node scripts/verify-deploy.mjs rust-sdk/target/release/${{ matrix.openapi_executable }} --client
      - name: Package standalone OpenAPI demo
        run: node scripts/package-openapi-demo.mjs rust-sdk/target/release/${{ matrix.openapi_executable }} ${{ matrix.target }}
      - name: Package production publisher
        run: node scripts/package-publisher.mjs rust-sdk/target/release/${{ matrix.openapi_executable }} ${{ matrix.target }}
      - run: npm test
      - name: Download minidev assets with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run download-assets; then
              exit 0
            fi
            echo "download-assets failed on attempt ${attempt}" >&2
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - run: npm run build
      - run: npm run validate
      - run: npm run package:sea
        env:
          SEA_TARGET: ${{ matrix.target }}
      - name: Verify compile, upload and publish with a local mock
        run: node scripts/verify-release.mjs ./dist/${{ matrix.executable }}
      - name: Check Windows runtime dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $installation = & $vswhere -latest -products '*' -property installationPath
          $toolVersion = Get-ChildItem (Join-Path $installation 'VC/Tools/MSVC') -Directory |
            Sort-Object Name -Descending | Select-Object -First 1
          $dumpbin = Join-Path $toolVersion.FullName 'bin/Hostx64/x64/dumpbin.exe'
          foreach ($binary in @('rust-sdk/target/release/mpaas-openapi-rs.exe', 'dist/mpaas-amr-win32-x64.exe')) {
            $dependencies = & $dumpbin /DEPENDENTS $binary
            if ($LASTEXITCODE -ne 0) { throw "Cannot inspect $binary" }
            $dependencies
            if (($dependencies -join "`n") -match '(?i)\b(vcruntime\d+(_\d+)?|msvcp\d+|libgcc_s_[^\s]+|libstdc\+\+-\d+)\.dll\b') {
              throw "$binary requires an external runtime DLL"
            }
          }
      - run: ./dist/${{ matrix.executable }} --help
      - run: ./dist/${{ matrix.executable }} openapi --client-help
      - run: ./dist/${{ matrix.executable }} validate artifacts/1.0.0.0/0000000000000012.amr
      - uses: actions/upload-artifact@v4
        with:
          name: mpaas-amr-${{ matrix.target }}
          path: |
            dist/${{ matrix.executable }}
            dist/mpaas-openapi-demo-${{ matrix.target }}.zip
            dist/mpaas-openapi-demo-${{ matrix.target }}.zip.sha256
            dist/mpaas-publisher-${{ matrix.target }}.zip
            dist/mpaas-publisher-${{ matrix.target }}.zip.sha256

  publish-artifacts:
    needs: [build, verify-clean-linux, verify-clean-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Publish full binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone compilation tools and Rust upload/publish clients for Linux x64 and Windows x64 generated by CI."
          while IFS= read -r platform_dir; do
            executable="$(find "$platform_dir" -type f \( -name 'mpaas-amr-linux-x64' -o -name 'mpaas-amr-win32-x64.exe' \) -print -quit)"
            gh release upload "$tag" "$executable" --repo "$GITHUB_REPOSITORY"
            for publisher in "$platform_dir"/mpaas-publisher-*.zip "$platform_dir"/mpaas-publisher-*.zip.sha256; do
              if [ -f "$publisher" ]; then
                gh release upload "$tag" "$publisher" --repo "$GITHUB_REPOSITORY"
              fi
            done
          done < <(find incoming -mindepth 1 -maxdepth 1 -type d -print)
      - name: Update artifact branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin build-artifacts >/dev/null 2>&1; then
            git fetch origin build-artifacts
            git checkout -B build-artifacts origin/build-artifacts
          else
            git checkout --orphan build-artifacts
            git rm -rf . >/dev/null 2>&1 || true
          fi
          release="releases/${GITHUB_RUN_NUMBER}"
          mkdir -p "$release"
          for platform_dir in incoming/mpaas-amr-*; do
            platform="$(basename "$platform_dir")"
            target_dir="$release/$platform"
            mkdir -p "$target_dir"
            executable="$(find "$platform_dir" -type f \( -name 'mpaas-amr-linux-x64' -o -name 'mpaas-amr-win32-x64.exe' \) -print -quit)"
            test -n "$executable"
            sha256sum "$executable" > "$target_dir/$(basename "$executable").sha256"
            split -b 95m -d -a 3 "$executable" "$target_dir/$(basename "$executable").part-"
            {
              echo "executable=$(basename "$executable")"
              echo "sha256=$(awk '{print $1}' "$target_dir/$(basename "$executable").sha256")"
              echo "parts=$(find "$target_dir" -name "$(basename "$executable").part-*" | wc -l | tr -d ' ')"
              echo "restore=cat $(basename "$executable").part-* > $(basename "$executable")"
            } > "$target_dir/README.txt"
          done
          git add -f "$release"
          git commit -m "build: publish artifacts for run ${GITHUB_RUN_NUMBER}" || true
          git push origin build-artifacts

  verify-clean-linux:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mpaas-amr-linux-x64
          path: incoming
      - name: Run single file in clean Linux container
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clean-linux
          mkdir -p clean-linux
          cp incoming/mpaas-amr-linux-x64 clean-linux/
          chmod +x clean-linux/mpaas-amr-linux-x64
          test ! -e clean-linux/node_modules
          test ! -e clean-linux/.minidev
          docker run --rm --network=none --platform linux/amd64 \
            -v "$PWD/clean-linux:/app" \
            -v "$PWD/fixtures/minimal:/project:ro" \
            -w /app debian:bookworm-slim \
            sh -euc '
              for dependency in node cargo java; do
                if command -v "$dependency"; then
                  echo "Unexpected runtime dependency: $dependency" >&2
                  exit 1
                fi
              done
              ./mpaas-amr-linux-x64 --help
              ./mpaas-amr-linux-x64 openapi --client-help > client-help.txt
              grep -q mpaas-openapi-rs client-help.txt
              cat client-help.txt
              ./mpaas-amr-linux-x64 build \
                --project /project \
                --app-id 0000000000000012 \
                --version 1.0.0.0 \
                --format both \
                --output artifacts
              ./mpaas-amr-linux-x64 validate artifacts/1.0.0.0/0000000000000012.zip
              ./mpaas-amr-linux-x64 validate artifacts/1.0.0.0/0000000000000012.amr
            '

  verify-clean-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mpaas-amr-win32-x64
          path: incoming
      - name: Run single file in clean Windows workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clean = Join-Path $env:RUNNER_TEMP 'mpaas-amr-clean'
          Remove-Item -Recurse -Force $clean -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $clean | Out-Null
          Copy-Item 'incoming/mpaas-amr-win32-x64.exe' "$clean/mpaas-amr-win32-x64.exe"
          Copy-Item -Recurse 'fixtures/minimal' "$clean/project"
          if (Test-Path "$clean/node_modules") { throw 'node_modules must not be present' }
          if (Test-Path "$clean/.minidev") { throw '.minidev must not be present' }
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          if (Get-Command node,cargo,java -CommandType Application -ErrorAction SilentlyContinue) {
            throw 'Node, Cargo and Java must not be available on PATH'
          }
          Push-Location $clean
          & .\mpaas-amr-win32-x64.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Standalone help failed' }
          $clientHelp = & .\mpaas-amr-win32-x64.exe openapi --client-help
          if ($LASTEXITCODE -ne 0 -or ($clientHelp -join "`n") -notmatch 'mpaas-openapi-rs') {
            throw 'Embedded OpenAPI client did not run'
          }
          $clientHelp
          & .\mpaas-amr-win32-x64.exe build --project .\project --app-id 0000000000000012 --version 1.0.0.0 --format both --output artifacts
          if ($LASTEXITCODE -ne 0) { throw 'Standalone build failed' }
          & .\mpaas-amr-win32-x64.exe validate artifacts\1.0.0.0\0000000000000012.zip
          if ($LASTEXITCODE -ne 0) { throw 'Standalone ZIP validation failed' }
          & .\mpaas-amr-win32-x64.exe validate artifacts\1.0.0.0\0000000000000012.amr
          if ($LASTEXITCODE -ne 0) { throw 'Standalone AMR validation failed' }
          Pop-Location
