name: Build mPaaS AMR CLI

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: linux-x64
            executable: mpaas-amr-linux-x64
          - os: windows-2022
            target: win32-x64
            executable: mpaas-amr-win32-x64.exe
    runs-on: ${{ matrix.os }}
    env:
      MINIDEV_SKIP_DOWNLOAD_ASSETS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - name: Download minidev assets with retry
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if npm run download-assets; then
              exit 0
            fi
            echo "download-assets failed on attempt ${attempt}" >&2
            if [ "$attempt" -lt 3 ]; then sleep 5; fi
          done
          exit 1
      - run: npm run build
      - run: npm run validate
      - run: npm run package:sea
        env:
          SEA_TARGET: ${{ matrix.target }}
      - run: ./dist/${{ matrix.executable }} --help
      - run: ./dist/${{ matrix.executable }} validate artifacts/1.0.0.0/0000000000000012.amr
      - uses: actions/upload-artifact@v4
        with:
          name: mpaas-amr-${{ matrix.target }}
          path: |
            dist/${{ matrix.executable }}

  publish-artifacts:
    needs: [build, verify-clean-linux, verify-clean-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Publish full binaries to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="build-${GITHUB_RUN_NUMBER}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Build ${GITHUB_RUN_NUMBER}" \
            --notes "Standalone Linux x64 and Windows x64 binaries generated by CI."
          while IFS= read -r platform_dir; do
            executable="$(find "$platform_dir" -type f \( -name 'mpaas-amr-linux-x64' -o -name 'mpaas-amr-win32-x64.exe' \) -print -quit)"
            gh release upload "$tag" "$executable" --repo "$GITHUB_REPOSITORY"
          done < <(find incoming -mindepth 1 -maxdepth 1 -type d -print)
      - name: Update artifact branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin build-artifacts >/dev/null 2>&1; then
            git fetch origin build-artifacts
            git checkout -B build-artifacts origin/build-artifacts
          else
            git checkout --orphan build-artifacts
            git rm -rf . >/dev/null 2>&1 || true
          fi
          release="releases/${GITHUB_RUN_NUMBER}"
          mkdir -p "$release"
          for platform_dir in incoming/mpaas-amr-*; do
            platform="$(basename "$platform_dir")"
            target_dir="$release/$platform"
            mkdir -p "$target_dir"
            executable="$(find "$platform_dir" -type f \( -name 'mpaas-amr-linux-x64' -o -name 'mpaas-amr-win32-x64.exe' \) -print -quit)"
            test -n "$executable"
            sha256sum "$executable" > "$target_dir/$(basename "$executable").sha256"
            split -b 95m -d -a 3 "$executable" "$target_dir/$(basename "$executable").part-"
            {
              echo "executable=$(basename "$executable")"
              echo "sha256=$(awk '{print $1}' "$target_dir/$(basename "$executable").sha256")"
              echo "parts=$(find "$target_dir" -name "$(basename "$executable").part-*" | wc -l | tr -d ' ')"
              echo "restore=cat $(basename "$executable").part-* > $(basename "$executable")"
            } > "$target_dir/README.txt"
          done
          git add -f "$release"
          git commit -m "build: publish artifacts for run ${GITHUB_RUN_NUMBER}" || true
          git push origin build-artifacts

  verify-clean-linux:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mpaas-amr-linux-x64
          path: incoming
      - name: Run single file in clean Linux container
        shell: bash
        run: |
          set -euo pipefail
          rm -rf clean-linux
          mkdir -p clean-linux
          cp incoming/mpaas-amr-linux-x64 clean-linux/
          chmod +x clean-linux/mpaas-amr-linux-x64
          test ! -e clean-linux/node_modules
          test ! -e clean-linux/.minidev
          docker run --rm --platform linux/amd64 \
            -v "$PWD/clean-linux:/app" \
            -v "$PWD/fixtures/minimal:/project:ro" \
            -w /app debian:bookworm-slim \
            ./mpaas-amr-linux-x64 --help
          docker run --rm --platform linux/amd64 \
            -v "$PWD/clean-linux:/app" \
            -v "$PWD/fixtures/minimal:/project:ro" \
            -w /app debian:bookworm-slim \
            ./mpaas-amr-linux-x64 build \
              --project /project \
              --app-id 0000000000000012 \
              --version 1.0.0.0 \
              --output artifacts
          docker run --rm --platform linux/amd64 \
            -v "$PWD/clean-linux:/app" \
            -w /app debian:bookworm-slim \
            ./mpaas-amr-linux-x64 validate artifacts/1.0.0.0/0000000000000012.amr

  verify-clean-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mpaas-amr-win32-x64
          path: incoming
      - name: Run single file in clean Windows workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $clean = Join-Path $env:RUNNER_TEMP 'mpaas-amr-clean'
          Remove-Item -Recurse -Force $clean -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force $clean | Out-Null
          Copy-Item 'incoming/mpaas-amr-win32-x64.exe' "$clean/mpaas-amr-win32-x64.exe"
          Copy-Item -Recurse 'fixtures/minimal' "$clean/project"
          if (Test-Path "$clean/node_modules") { throw 'node_modules must not be present' }
          if (Test-Path "$clean/.minidev") { throw '.minidev must not be present' }
          Push-Location $clean
          & .\mpaas-amr-win32-x64.exe --help
          & .\mpaas-amr-win32-x64.exe build --project .\project --app-id 0000000000000012 --version 1.0.0.0 --output artifacts
          & .\mpaas-amr-win32-x64.exe validate artifacts\1.0.0.0\0000000000000012.amr
          Pop-Location
